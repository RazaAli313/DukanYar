[project]
name = "dukanyar-backend"
version = "0.1.0"
description = "DukanYar backend — FastAPI service for the text & voice conversation module"
requires-python = ">=3.13"
dependencies = [
    "edge-tts>=6.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.27",
    "openai>=3.6.0",
    "pydantic-settings>=2.15.0",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
